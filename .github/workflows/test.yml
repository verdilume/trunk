name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trunk
    steps:
      - uses: actions/checkout@v7
        with:
          path: trunk
          persist-credentials: false
      - name: Check out Moss
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.MOSS_REPOSITORY || format('{0}/moss', github.repository_owner) }}
          path: moss
          ssh-key: ${{ secrets.MOSS_DEPLOY_KEY }}
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.19.2"
          rebar3-version: "3"
          # elixir-version: "1"
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
